name: Supabase Keepalive

on:
  schedule:
    # 每 3 天一次，留足余量：Supabase 免费版是「过去 7 天没有数据库活动」才会自动暂停。
    - cron: "0 5 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API to keep the free project active
        env:
          SUPABASE_URL: https://cskjsiuirxhyxibsoubm.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_cPY2GC2pmqS95ECIfbCt8w_ftlIk9It
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase REST API responded with HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 500 ]; then
            echo "Unexpected status, failing so it shows up in Actions."
            exit 1
          fi
